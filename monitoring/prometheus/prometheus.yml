global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: sglang
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:30000
  - job_name: dcgm
    static_configs:
      - targets:
          - dcgm-exporter:9400
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
