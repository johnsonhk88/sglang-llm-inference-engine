apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang
  labels:
    app: sglang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang
  template:
    metadata:
      labels:
        app: sglang
    spec:
      enableServiceLinks: false
      containers:
        - name: sglang
          image: lmsysorg/sglang:latest
          command:
            - python3
            - -m
            - sglang.launch_server
          args:
            - --model-path
            - "Qwen/Qwen3-0.6B"
            - --served-model-name
            - "qwen-small"
            - --host
            - "0.0.0.0"
            - --port
            - "30000"
            - --mem-fraction-static
            - "0.2"
            - --enable-metrics
          ports:
            - name: http
              containerPort: 30000
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
                  optional: true
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: 16Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "1"
              memory: 4Gi
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: hf-cache
          hostPath:
            path: /home/johnsonhk88/.cache/huggingface
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-service
  labels:
    app: sglang
spec:
  type: ClusterIP
  selector:
    app: sglang
  ports:
    - name: http
      port: 30000
      targetPort: http
      protocol: TCP
